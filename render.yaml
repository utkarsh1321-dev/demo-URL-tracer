# render.yaml — URL Tracer Production Deployment Configuration
# Render (https://render.com) auto-reads this file from the repo root.
#
# To deploy:
#   1. Connect this repository to Render
#   2. In Render Dashboard → Environment, add ALL "sync: false" vars manually
#   3. Render will build and deploy automatically on git push to main
#
# SECURITY NOTES:
#   - Values marked "sync: false" MUST be set in the Render Dashboard manually.
#   - Never put DATABASE_URL, SUPABASE_JWT_SECRET, or SUPABASE_SERVICE_ROLE_KEY
#     in this file — they are production secrets.
#   - SUPABASE_URL and SUPABASE_ANON_KEY are public by design (subject to RLS).

services:
  - type: web
    name: url-tracer-backend
    runtime: python
    pythonVersion: "3.11.9"       # Pin to 3.11 — stable, all wheels pre-built.
    region: singapore
    plan: free
    rootDir: backend
    # build_model.py trains the ML model DURING the build step.
    # Model is saved to backend/models/url_phishing_model.pkl before uvicorn starts.
    buildCommand: pip install -r requirements.txt && python build_model.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      # ── Python version ────────────────────────────────────────────────────
      - key: PYTHON_VERSION
        value: "3.11.9"

      # ── Application ───────────────────────────────────────────────────────
      - key: APP_ENV
        value: production

      # ── CORS — allow only the Vercel frontend ─────────────────────────────
      - key: ALLOWED_ORIGINS
        value: https://demo-url-tracer.vercel.app

      # ── Supabase (public — safe to commit) ────────────────────────────────
      - key: SUPABASE_URL
        value: https://xzkseyfhcadeehwzglah.supabase.co

      # Supabase anon key (public — enforced by RLS)
      # Find in: Supabase → Project Settings → API → anon/public
      - key: SUPABASE_ANON_KEY
        sync: false

      # ── Secrets — set manually in Render Dashboard ─────────────────────────
      # Supabase → Project Settings → API → JWT Secret
      - key: SUPABASE_JWT_SECRET
        sync: false

      # Supabase → Project Settings → API → service_role key
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # ── Database (component-based — avoids URL encoding issues) ───────────
      # Only DB_PASSWORD needs to be set in the Render Dashboard.
      # All other DB fields are static and safe to commit.
      - key: DB_PASSWORD
        sync: false

      - key: DB_HOST
        value: aws-0-ap-northeast-2.pooler.supabase.com

      - key: DB_PORT
        value: "6543"

      - key: DB_NAME
        value: postgres

      - key: DB_USER
        value: postgres.xzkseyfhcadeehwzglah

      # ── Logging ───────────────────────────────────────────────────────────
      - key: LOG_LEVEL
        value: INFO

      # NOTE: MODEL_PATH is intentionally NOT set here.
      # build_model.py saves to backend/models/url_phishing_model.pkl
      # url_model.py finds it automatically via Path(__file__).parent.parent / "models"
      # Setting MODEL_PATH would override this and break model loading.
